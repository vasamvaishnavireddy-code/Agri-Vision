<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGRIVISION | Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card glass-card">
        <h1>Welcome Back</h1>
        <p>Sign in to access your AGRIVISION workspace.</p>
        <form class="auth-form" data-type="login">
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required />
          </div>
          <button class="btn btn-dark auth-btn" type="submit">Login</button>
          <div class="auth-message" aria-live="polite"></div>
        </form>
        <p class="auth-switch">New here? <a href="register.html">Create account</a></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
