<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Role Selection | AGRIVISION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="role.css" />
  </head>
  <body class="role-body">
    <div class="role-shell">
      <header class="role-header glass">
        <a class="brand" href="index.html">
          <span class="brand-mark"><i class="fa-solid fa-leaf"></i></span>
          <span>AGRIVISION</span>
        </a>
        <div>
          <h1>Select your role</h1>
          <p>Choose the path that fits your work and unlock the right experience.</p>
        </div>
      </header>

      <section class="role-grid">
        <button class="role-card" data-role="Farmer"><i class="fa-solid fa-tractor"></i><h3>Farmer</h3><p>Crop planning, recommendations, and field intelligence.</p><span>Select</span></button>
        <button class="role-card" data-role="Equipment Owner"><i class="fa-solid fa-gears"></i><h3>Equipment Owner</h3><p>List rentals, bookings, and machine availability.</p><span>Select</span></button>
        <button class="role-card" data-role="Supplier"><i class="fa-solid fa-seedling"></i><h3>Supplier</h3><p>Manage inputs, inventory, and supply distribution.</p><span>Select</span></button>
        <button class="role-card" data-role="Retailer"><i class="fa-solid fa-store"></i><h3>Retailer</h3><p>Scale wholesale operations and trading channels.</p><span>Select</span></button>
        <button class="role-card" data-role="Consumer"><i class="fa-solid fa-basket-shopping"></i><h3>Consumer</h3><p>Access fresh produce with transparency and trust.</p><span>Select</span></button>
        <button class="role-card" data-role="Logistics Partner"><i class="fa-solid fa-truck-fast"></i><h3>Logistics Partner</h3><p>Coordinate transport, warehouses, and delivery routes.</p><span>Select</span></button>
        <button class="role-card" data-role="Government Officer"><i class="fa-solid fa-landmark"></i><h3>Government Officer</h3><p>Monitor schemes and support communities effectively.</p><span>Select</span></button>
        <button class="role-card" data-role="Research & Innovation"><i class="fa-solid fa-flask"></i><h3>Research & Innovation</h3><p>Analyze trends and accelerate data-driven innovation.</p><span>Select</span></button>
      </section>
    </div>
    <script src="role.js"></script>
  </body>
</html>
