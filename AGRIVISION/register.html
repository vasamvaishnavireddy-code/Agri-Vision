<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGRIVISION | Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card glass-card">
        <h1>Create Account</h1>
        <p>Join the AGRIVISION ecosystem and unlock your role.</p>
        <form class="auth-form" data-type="register">
          <div class="field-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Your full name" required />
          </div>
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create password" required />
          </div>
          <div class="field-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" required />
          </div>
          <button class="btn btn-dark auth-btn" type="submit">Register</button>
          <div class="auth-message" aria-live="polite"></div>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
